<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charity Water Landing Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER / NAVIGATION -->
  <header class="navbar">
    <nav class="nav-links-left">
      <a href="#">Let's do this</a>
      <a href="#">About</a>
      <a href="#">News</a>
      <a href="#">FAQ</a>
    </nav>
    <div class="nav-links-right">
      <a href="#" class="login-link">Log in</a>
      <a href="#" class="btn-contact">Contact </a>
    </div>
  </header>

  <!-- MAIN HERO SECTION -->
  <main class="hero-section">
    
    <!-- BRAND LOGO HEADER -->
    <div class="logo-container">
      <div class="icon-box">
        <!-- Yellow Jerrycan/Bucket Icon Placeholder -->
        <span class="icon">🪣</span> 
      </div>
      <h1 class="logo-text">charity: water</h1>
    </div>

    <!-- MAIN CONTENT CONTAINER -->
    <div class="hero-content">
      
      <!-- LEFT TEXT CARD -->
      <div class="text-card">
        <h2>Clean water can't wait, be the change.</h2>
        <p>Be part of the generation that contributes to clean water for all of those in need.</p>
        <span class="signature">Sonya Purvis</span>
      </div>

      <!-- RIGHT IMAGE -->
      <div class="image-container">
        <!-- Replace the src URL with your actual image file -->
        <img src="project.jpg" alt="Group of people gathered together">
      </div>

    </div>

  </main>

</body>
</html>
